<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puzzle Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <div class="logo">🧩 Puzzle Game</div>

    <div class="top-actions">
      <span id="scoreDisplay">Score: 0</span>
      <button id="homeBtn">⌂ Home</button>
    </div>
  </header>

  <main>

    <!-- HOME -->
    <section id="homeScreen" class="screen active">
      <div class="hero">
        <h1>Puzzle Game</h1>
        <p>Challenge your brain with six different puzzles.</p>
      </div>

      <div class="difficulty">
        <h2>Choose Difficulty</h2>

        <div class="difficulty-buttons">
          <button class="difficulty-btn active" data-level="easy">
            Easy
          </button>

          <button class="difficulty-btn" data-level="medium">
            Medium
          </button>

          <button class="difficulty-btn" data-level="hard">
            Hard
          </button>
        </div>
      </div>

      <div class="games-grid">

        <button class="game-card" data-game="sliding">
          <span>🧩</span>
          <h3>Sliding Puzzle</h3>
          <p>Arrange the tiles in order.</p>
        </button>

        <button class="game-card" data-game="memory">
          <span>🧠</span>
          <h3>Memory Match</h3>
          <p>Find matching pairs.</p>
        </button>

        <button class="game-card" data-game="2048">
          <span>🔢</span>
          <h3>2048</h3>
          <p>Combine numbers to reach 2048.</p>
        </button>

        <button class="game-card" data-game="sudoku">
          <span>🔲</span>
          <h3>Sudoku</h3>
          <p>Complete the number grid.</p>
        </button>

        <button class="game-card" data-game="minesweeper">
          <span>💣</span>
          <h3>Minesweeper</h3>
          <p>Clear the board without mines.</p>
        </button>

        <button class="game-card" data-game="word">
          <span>🔤</span>
          <h3>Word Scramble</h3>
          <p>Unscramble the hidden word.</p>
        </button>

      </div>
    </section>


    <!-- GAME -->
    <section id="gameScreen" class="screen">

      <div class="game-header">
        <button id="backBtn">← Back</button>

        <div>
          <h2 id="gameTitle">Puzzle</h2>
          <p id="difficultyText">Easy</p>
        </div>

        <button id="restartBtn">↻ Restart</button>
      </div>

      <div id="gameArea"></div>

    </section>

  </main>

  <div id="messageBox" class="message-box hidden">
    <div class="message-content">
      <h2 id="messageTitle">You Win!</h2>
      <p id="messageText"></p>
      <button id="messageRestart">Play Again</button>
      <button id="messageHome">Home</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
